# Exercise 7.3 — chặn merge khi chất lượng agent tụt.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression so với baseline
# → step fail → job fail → bật "Require status checks" cho branch main thì PR không merge được.
name: quality-gate
on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Eval + quality gate (accuracy ≥ 85%, no regression vs committed baseline)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json --out eval_ci.json
