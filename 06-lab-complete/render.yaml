# Render Blueprint: web service (Docker) + Key Value (Redis-compatible).
# Blueprint path khi tạo trên dashboard: 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true        # Render tự sinh, không ghi giá trị vào repo
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []              # chỉ cho service trong cùng Render private network
